name: evertorch

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EVERTORCH_POSTGRES_DB:-evertorch_dev}
      POSTGRES_USER: ${EVERTORCH_POSTGRES_USER:-evertorch}
      POSTGRES_PASSWORD: ${EVERTORCH_POSTGRES_PASSWORD:?Set EVERTORCH_POSTGRES_PASSWORD in docker/.env}
    ports:
      # Loopback only: the development database is never exposed to the network.
      - "127.0.0.1:${EVERTORCH_POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep versioned data below this directory.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
