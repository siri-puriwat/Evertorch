id: map.training_field
displayName: Training Field
server:
  spawnPoint:
    position: { x: -21.0, y: 0.0, z: 0.0 }
    facing: { x: 1.0, z: 0.0 }
  portals:
    # In front of the west gate; arrivals face east, 1.5 m inside it.
    - center: { x: -22.5, y: 0.0, z: 0.0 }
      radius: 1.0
      destination:
        map: map.training_ground
        position: { x: 20.5, y: 0.0, z: 0.0 }
        facing: { x: -1.0, z: 0.0 }
