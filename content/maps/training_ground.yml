id: map.training_ground
displayName: Training Ground
server:
  spawnPoint:
    position: { x: 0.0, y: 0.0, z: 0.0 }
    facing: { x: 0.0, z: 1.0 }
  monsterSpawns:
    - monster: monster.training_slime
      center: { x: 12.0, y: 0.0, z: 12.0 }
      radius: 6.0
      count: 4
      respawnMs: 8000
  portals:
    # In front of the east gate; arrivals on the field face east beside its west gate.
    - center: { x: 22.5, y: 0.0, z: 0.0 }
      radius: 1.0
      destination:
        map: map.training_field
        position: { x: -21.0, y: 0.0, z: 0.0 }
        facing: { x: 1.0, z: 0.0 }
  npcs:
    # Each on its own marker cell, which nobody can walk onto.
    - npc: npc.quartermaster
      position: { x: -3.5, y: 0.0, z: 4.5 }
      facing: { x: 0.614, z: -0.789 } # toward the spawn point
    - npc: npc.gate_warden
      position: { x: 20.5, y: 0.0, z: 3.5 }
      facing: { x: 0.0, z: -1.0 } # toward where the field's portal lands a player
    - npc: npc.guildmaster
      position: { x: 4.5, y: 0.0, z: -4.5 }
      facing: { x: -0.707, z: 0.707 } # toward the spawn point
navigation:
  # One symbol per cell, northern row first. The grid is the graybox geometry: the client builds its
  # visuals from it and the server validates movement against it.
  cellSize: 1.0
  origin: { x: -24.0, z: -24.0 }
  agentRadius: 0.3
  maxStepHeight: 0.4
  legend:
    - { symbol: ".", surface: floor, height: 0.0 }
    - { symbol: "^", surface: floor, height: 1.0 }
    - { symbol: "#", surface: wall, height: 0.0 }
    - { symbol: "o", surface: obstacle, height: 0.0 }
    - { symbol: "N", surface: npcMarker, height: 0.0 }
    - { symbol: "G", surface: gate, height: 0.0 }
    - { symbol: "a", surface: floor, ramp: { axis: z, from: 0.0, to: 0.5 } }
    - { symbol: "b", surface: floor, ramp: { axis: z, from: 0.5, to: 1.0 } }
    - { symbol: "c", surface: floor, ramp: { axis: x, from: 1.0, to: 0.5 } }
    - { symbol: "d", surface: floor, ramp: { axis: x, from: 0.5, to: 0.0 } }
  rows:
    - "################################################"
    - "#.................#............................#"
    - "#.................#............................#"
    - "#.................#............................#"
    - "#.....^^^^^^^^....#............................#"
    - "#.....^^^^^^^^....#............................#"
