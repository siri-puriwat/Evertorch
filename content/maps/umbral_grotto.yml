id: map.umbral_grotto
displayName: Umbral Grotto
server:
  spawnPoint:
    position: { x: -29.0, y: 0.0, z: -22.0 }
    facing: { x: 1.0, z: 0.0 }
  monsterSpawns:
    # The crawler hall's pack, near enough to one another that a swing brings the rest.
    - monster: monster.grotto_crawler
      center: { x: -18.5, y: 0.0, z: 16.5 }
      radius: 5.0
      count: 6
      respawnMs: 20000
    # The wisp gallery's wisps, which keep their distance and numb whoever fights them.
    - monster: monster.gloom_wisp
      center: { x: 16.0, y: 0.0, z: -19.5 }
      radius: 6.0
      count: 5
      respawnMs: 20000
    # The Slime Monarch alone at the heart of its chamber, back an hour after its death, give or take ten minutes.
    - monster: monster.slime_monarch
      center: { x: 18.0, y: 0.0, z: 18.0 }
      radius: 0.0
      count: 1
      respawnMs: 3600000
      respawnVarianceMs: 600000
  portals:
    # In front of the west gate; arrivals on the field face west beside its east gate.
    - center: { x: -30.5, y: 0.0, z: -22.0 }
      radius: 1.0
      destination:
        map: map.training_field
        position: { x: 20.5, y: 0.0, z: -8.0 }
        facing: { x: -1.0, z: 0.0 }
navigation:
  # One symbol per cell, northern row first, as on the training field: the entrance hall in the south-west, the
  # crawler hall in the north-west, the wisp gallery in the south-east, and the boss chamber in the north-east, whose
  # one way in is the corridor from the crawler hall.
  cellSize: 1.0
  origin: { x: -32.0, z: -32.0 }
  agentRadius: 0.3
  maxStepHeight: 0.4
  legend:
    - { symbol: ".", surface: floor, height: 0.0 }
    - { symbol: "#", surface: wall, height: 0.0 }
    - { symbol: "o", surface: obstacle, height: 0.0 }
    - { symbol: "G", surface: gate, height: 0.0 }
