  shop:
    - item: item.consumable.minor_health
      price: 20
    - item: item.consumable.minor_mana
      price: 30
    - item: item.armor.cloth
      price: 40
    - item: item.weapon.training_sword
      price: 50
    - item: item.weapon.training_staff
      price: 50
client:
  prefab: npc_quartermaster
